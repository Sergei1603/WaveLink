name: Build & push images

# Собирает Docker-образы API и фронтенда на раннере GitHub и пушит их
# в GitHub Container Registry (ghcr.io). На VPS остаётся только docker compose pull.

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:   # ручной запуск из вкладки Actions

env:
  REGISTRY: ghcr.io
  # ghcr требует имена в нижнем регистре.
  IMAGE_API: ghcr.io/sergei1603/wavelink-api
  IMAGE_WEB: ghcr.io/sergei1603/wavelink-web

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # нужно для пуша в ghcr

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ---------- API ----------
      - name: Build & push API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: WaveLink.API/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_API }}:latest
            ${{ env.IMAGE_API }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ---------- Frontend (nginx) ----------
      - name: Build & push web
        uses: docker/build-push-action@v6
        with:
          context: ./client
          file: ./client/Dockerfile
          push: true
          build-args: |
            VITE_API_URL=
          tags: |
            ${{ env.IMAGE_WEB }}:latest
            ${{ env.IMAGE_WEB }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
